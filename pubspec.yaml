name: meu_mobile
description: Official mobile application for Mersin University students.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  pretty_dio_logger: ^1.4.0
  internet_connection_checker_plus: ^3.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  gap: ^3.0.1
  intl: ^0.20.3
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  google_maps_flutter: ^2.17.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.3
  flutter_map: 7.0.2
  latlong2: 0.9.1
  flutter_map_mbtiles: ^1.0.4
  path_provider: ^2.1.6

  package_info_plus: ^10.2.1
  in_app_review: ^2.0.12
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/illustrations/
    - assets/maps/meu_campus.mbtiles

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
